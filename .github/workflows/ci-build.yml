name: CI

# dist/ is the artifact GitHub actually runs, so it is committed to the repo.
# CI verifies that it matches src/ instead of rebuilding and committing it:
# a stale dist/ fails the check rather than being silently overwritten.
permissions:
  contents: read

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

# a new push supersedes an in-flight run for the same ref
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'   # must match runs.using in action.yml
          cache: npm

      - name: Install dependencies
        run: npm ci   # install from the lockfile, never resolve fresh versions

      - name: Run tests
        run: npm test

      - name: Build with ncc
        run: npm run build

      - name: Verify dist/ is up to date
        run: |
          if ! git diff --quiet -- dist/; then
            echo "::error::dist/ does not match src/. Run 'npm ci && npm run build' and commit dist/."
            git diff --stat -- dist/
            exit 1
          fi
          echo "dist/ is up to date"
