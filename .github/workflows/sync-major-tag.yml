name: Sync major‐version tag

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  # Everyone on @v1 gets whatever this tag points at, so make sure the released
  # commit carries a dist/ that actually matches its src/ before moving the tag.
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the released commit
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build with ncc
        run: npm run build

      - name: Verify dist/ is up to date
        run: |
          if ! git diff --quiet -- dist/; then
            echo "::error::Released commit has a stale dist/ — refusing to move the major tag."
            git diff --stat -- dist/
            exit 1
          fi

  sync:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needs to push the tag
    # Skip pre-releases - only sync major tag for stable releases
    if: ${{ !github.event.release.prerelease }}
    steps:
      - name: Check out the repo
        uses: actions/checkout@v6
        with:
          fetch-depth: 0       # grab all history so we can push tags

      - name: Compute major version
        id: major
        shell: bash
        run: |
          # strip leading "v" if present, then grab the first number
          TAG=${GITHUB_REF#refs/tags/}
          MAJOR=$(echo "$TAG" | sed -E 's/^v?([0-9]+)\..*$/\1/')
          echo "MAJOR=v${MAJOR}" >> $GITHUB_ENV

      - name: Refuse to move $MAJOR backwards
        shell: bash
        run: |
          # A backport released after a newer version (1.2.3 published after 1.3.0)
          # sits on a side branch, not on top of what $MAJOR already points at.
          # Moving the tag there would silently downgrade every @$MAJOR consumer.
          CURRENT=$(git rev-parse -q --verify "refs/tags/${MAJOR}^{commit}" || true)
          if [ -z "$CURRENT" ]; then
            echo "${MAJOR} does not exist yet — nothing to compare against"
          elif [ "$CURRENT" = "$GITHUB_SHA" ]; then
            echo "${MAJOR} already points at this commit"
          elif git merge-base --is-ancestor "$CURRENT" "$GITHUB_SHA"; then
            echo "moving ${MAJOR} forward: ${CURRENT} -> ${GITHUB_SHA}"
          else
            echo "::error::${GITHUB_SHA} is not a descendant of ${MAJOR} (${CURRENT}); refusing to move the tag backwards."
            exit 1
          fi

      - name: Create or update v$MAJOR tag
        shell: bash
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # force‐update the tag to point at this release commit
          git tag -f "$MAJOR"
          git push origin "$MAJOR" --force
